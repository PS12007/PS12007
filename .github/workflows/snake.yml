name: generate-snake

on:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: generate snake game from a github user (github-contribution-grid-snake)
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#ee1515&color_dots=#efeee3,#ffe9a8,#f0c000,#ee1515,#a1160a
            dist/github-contribution-grid-snake-dark.svg?color_snake=#f0c000&color_dots=#161b22,#4a3510,#8a6412,#d1a01c,#f0c000
            dist/github-contribution-grid-snake.gif?color_snake=#ee1515&color_dots=#efeee3,#ffe9a8,#f0c000,#ee1515,#a1160a

      - name: push snake output to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
