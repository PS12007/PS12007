<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 60" width="900" height="60" shape-rendering="crispEdges" role="img" aria-label="a poke ball rolling down a route">
  <rect width="900" height="60" fill="#0d1117"/>

  <!-- route path -->
  <rect x="0" y="44" width="900" height="10" fill="#151c27"/>
  <g fill="#2b3546">
    <g>
      <rect x="0" y="47" width="26" height="4"/><rect x="40" y="47" width="26" height="4"/><rect x="80" y="47" width="26" height="4"/>
      <rect x="120" y="47" width="26" height="4"/><rect x="160" y="47" width="26" height="4"/><rect x="200" y="47" width="26" height="4"/>
      <rect x="240" y="47" width="26" height="4"/><rect x="280" y="47" width="26" height="4"/><rect x="320" y="47" width="26" height="4"/>
      <rect x="360" y="47" width="26" height="4"/><rect x="400" y="47" width="26" height="4"/><rect x="440" y="47" width="26" height="4"/>
      <rect x="480" y="47" width="26" height="4"/><rect x="520" y="47" width="26" height="4"/><rect x="560" y="47" width="26" height="4"/>
      <rect x="600" y="47" width="26" height="4"/><rect x="640" y="47" width="26" height="4"/><rect x="680" y="47" width="26" height="4"/>
      <rect x="720" y="47" width="26" height="4"/><rect x="760" y="47" width="26" height="4"/><rect x="800" y="47" width="26" height="4"/>
      <rect x="840" y="47" width="26" height="4"/><rect x="880" y="47" width="26" height="4"/><rect x="920" y="47" width="26" height="4"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;-40 0" dur="1.6s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- tall grass along the verge -->
  <g fill="#1d4a2c">
    <g>
      <rect x="30" y="34" width="5" height="10"/><rect x="38" y="30" width="5" height="14"/><rect x="46" y="36" width="5" height="8"/>
      <rect x="190" y="36" width="5" height="8"/><rect x="198" y="31" width="5" height="13"/><rect x="206" y="35" width="5" height="9"/>
      <rect x="352" y="34" width="5" height="10"/><rect x="360" y="29" width="5" height="15"/><rect x="368" y="36" width="5" height="8"/>
      <rect x="520" y="35" width="5" height="9"/><rect x="528" y="30" width="5" height="14"/><rect x="536" y="34" width="5" height="10"/>
      <rect x="688" y="34" width="5" height="10"/><rect x="696" y="30" width="5" height="14"/><rect x="704" y="36" width="5" height="8"/>
      <rect x="850" y="35" width="5" height="9"/><rect x="858" y="29" width="5" height="15"/><rect x="866" y="35" width="5" height="9"/>
      <animateTransform attributeName="transform" type="skewX" values="0;5;0;-5;0" dur="4.2s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- gold pixel sparkles -->
  <g fill="#f0c000">
    <rect x="96" y="14" width="3" height="3"><animate attributeName="opacity" values="1;0.1;1" dur="1.9s" repeatCount="indefinite"/></rect>
    <rect x="284" y="10" width="3" height="3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.3s" repeatCount="indefinite"/></rect>
    <rect x="466" y="16" width="3" height="3"><animate attributeName="opacity" values="1;0.15;1" dur="2.1s" repeatCount="indefinite"/></rect>
    <rect x="652" y="9" width="3" height="3"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.7s" repeatCount="indefinite"/></rect>
    <rect x="818" y="15" width="3" height="3"><animate attributeName="opacity" values="1;0.2;1" dur="2.5s" repeatCount="indefinite"/></rect>
  </g>

  <!-- a poke ball rolling the length of the route -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-40 0;960 0" dur="11s" repeatCount="indefinite"/>
    <g transform="translate(0,33)" shape-rendering="geometricPrecision">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0;1440" dur="11s" repeatCount="indefinite"/>
        <circle cx="0" cy="0" r="11" fill="#f6f6f6" stroke="#17171a" stroke-width="2.5"/>
        <path d="M-11 0 A11 11 0 0 1 11 0 Z" fill="#ee1515"/>
        <rect x="-11.5" y="-2" width="23" height="4" fill="#17171a"/>
        <circle cx="0" cy="0" r="3.6" fill="#f6f6f6" stroke="#17171a" stroke-width="2"/>
      </g>
    </g>
  </g>
</svg>
