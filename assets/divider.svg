<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 60" width="900" height="60" shape-rendering="crispEdges">
  <rect x="0" y="0" width="900" height="60" fill="#0d1117"/>

  <!-- back mountain layer, slow scroll -->
  <g fill="#1c2b3a">
    <g>
      <rect x="0" y="30" width="900" height="30"/>
      <rect x="20" y="20" width="40" height="10"/>
      <rect x="60" y="10" width="40" height="20"/>
      <rect x="180" y="24" width="50" height="16"/>
      <rect x="260" y="14" width="30" height="26"/>
      <rect x="360" y="22" width="60" height="18"/>
      <rect x="470" y="12" width="40" height="28"/>
      <rect x="560" y="26" width="50" height="14"/>
      <rect x="660" y="16" width="36" height="24"/>
      <rect x="740" y="24" width="50" height="16"/>
      <rect x="840" y="14" width="40" height="26"/>
      <rect x="920" y="20" width="40" height="10"/>
      <rect x="960" y="10" width="40" height="20"/>
      <rect x="1080" y="24" width="50" height="16"/>
      <rect x="1160" y="14" width="30" height="26"/>
      <rect x="1260" y="22" width="60" height="18"/>
      <rect x="1370" y="12" width="40" height="28"/>
      <rect x="1460" y="26" width="50" height="14"/>
      <rect x="1560" y="16" width="36" height="24"/>
      <rect x="1640" y="24" width="50" height="16"/>
      <rect x="1740" y="14" width="40" height="26"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;-900 0" dur="26s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- front mountain layer, faster scroll -->
  <g fill="#101823">
    <g>
      <rect x="0" y="40" width="900" height="20"/>
      <rect x="10" y="34" width="30" height="8"/>
      <rect x="90" y="30" width="34" height="12"/>
      <rect x="150" y="36" width="20" height="6"/>
      <rect x="240" y="28" width="40" height="14"/>
      <rect x="330" y="34" width="24" height="8"/>
      <rect x="410" y="30" width="36" height="12"/>
      <rect x="500" y="36" width="22" height="6"/>
      <rect x="580" y="28" width="38" height="14"/>
      <rect x="670" y="34" width="26" height="8"/>
      <rect x="760" y="30" width="34" height="12"/>
      <rect x="850" y="36" width="20" height="6"/>
      <rect x="900" y="40" width="900" height="20"/>
      <rect x="910" y="34" width="30" height="8"/>
      <rect x="990" y="30" width="34" height="12"/>
      <rect x="1050" y="36" width="20" height="6"/>
      <rect x="1140" y="28" width="40" height="14"/>
      <rect x="1230" y="34" width="24" height="8"/>
      <rect x="1310" y="30" width="36" height="12"/>
      <rect x="1400" y="36" width="22" height="6"/>
      <rect x="1480" y="28" width="38" height="14"/>
      <rect x="1570" y="34" width="26" height="8"/>
      <rect x="1660" y="30" width="34" height="12"/>
      <rect x="1750" y="36" width="20" height="6"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;-900 0" dur="14s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- twinkling pixels above the skyline -->
  <g fill="#39ff8f">
    <rect x="60" y="8" width="3" height="3"><animate attributeName="opacity" values="1;0.1;1" dur="1.8s" repeatCount="indefinite"/></rect>
    <rect x="220" y="4" width="3" height="3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/></rect>
    <rect x="420" y="8" width="3" height="3"><animate attributeName="opacity" values="1;0.15;1" dur="2s" repeatCount="indefinite"/></rect>
    <rect x="620" y="4" width="3" height="3"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" repeatCount="indefinite"/></rect>
    <rect x="800" y="8" width="3" height="3"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/></rect>
  </g>
</svg>
