<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05060f"/>
      <stop offset="65%" stop-color="#0d1224"/>
      <stop offset="100%" stop-color="#141a2e"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#39ff8f"/>
      <stop offset="100%" stop-color="#12331f"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="900" height="260" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <rect x="40" y="20" width="4" height="4"><animate attributeName="opacity" values="1;0.15;1" dur="2.6s" repeatCount="indefinite"/></rect>
    <rect x="120" y="45" width="4" height="4"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" repeatCount="indefinite"/></rect>
    <rect x="210" y="18" width="4" height="4"><animate attributeName="opacity" values="1;0.1;1" dur="2.2s" begin="0.4s" repeatCount="indefinite"/></rect>
    <rect x="300" y="55" width="4" height="4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.9s" repeatCount="indefinite"/></rect>
    <rect x="380" y="25" width="4" height="4"><animate attributeName="opacity" values="1;0.2;1" dur="3.4s" begin="0.8s" repeatCount="indefinite"/></rect>
    <rect x="470" y="40" width="4" height="4"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></rect>
    <rect x="560" y="15" width="4" height="4"><animate attributeName="opacity" values="1;0.15;1" dur="2.8s" begin="0.3s" repeatCount="indefinite"/></rect>
    <rect x="640" y="50" width="4" height="4"><animate attributeName="opacity" values="0.25;1;0.25" dur="3.2s" repeatCount="indefinite"/></rect>
    <rect x="760" y="22" width="4" height="4"><animate attributeName="opacity" values="1;0.2;1" dur="2.5s" begin="0.6s" repeatCount="indefinite"/></rect>
    <rect x="830" y="48" width="4" height="4"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.0s" repeatCount="indefinite"/></rect>
    <rect x="90" y="70" width="3" height="3"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.1s" repeatCount="indefinite"/></rect>
    <rect x="700" y="75" width="3" height="3"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.7s" repeatCount="indefinite"/></rect>
  </g>

  <!-- moon (pixel crescent) -->
  <g fill="#ffe9a8">
    <rect x="760" y="30" width="10" height="10"/>
    <rect x="770" y="20" width="10" height="10"/>
    <rect x="770" y="40" width="10" height="10"/>
    <rect x="780" y="20" width="10" height="30"/>
    <rect x="790" y="20" width="10" height="30"/>
    <rect x="800" y="30" width="10" height="10"/>
    <rect x="800" y="40" width="10" height="10"/>
  </g>
  <g fill="#0d1224">
    <rect x="774" y="26" width="10" height="18"/>
  </g>

  <!-- floor -->
  <rect x="0" y="230" width="900" height="30" fill="#1b2138"/>

  <!-- desk -->
  <rect x="280" y="195" width="340" height="12" fill="#5a3d2b"/>
  <rect x="290" y="207" width="14" height="23" fill="#42291c"/>
  <rect x="596" y="207" width="14" height="23" fill="#42291c"/>

  <!-- monitor -->
  <rect x="380" y="120" width="140" height="90" fill="#1c1f2b"/>
  <rect x="388" y="128" width="124" height="66" fill="#04140a"/>
  <rect x="388" y="128" width="124" height="66" fill="url(#screenGlow)">
    <animate attributeName="opacity" values="0.55;0.85;0.55" dur="2.4s" repeatCount="indefinite"/>
  </rect>
  <g fill="#7dffb0">
    <rect x="396" y="136" width="40" height="5"><animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/></rect>
    <rect x="396" y="146" width="70" height="5"><animate attributeName="opacity" values="0.4;1;0.4" dur="1.9s" repeatCount="indefinite"/></rect>
    <rect x="396" y="156" width="55" height="5"><animate attributeName="opacity" values="1;0.4;1" dur="2.1s" repeatCount="indefinite"/></rect>
    <rect x="396" y="166" width="30" height="5"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.7s" repeatCount="indefinite"/></rect>
    <rect x="396" y="176" width="8" height="5"><animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/></rect>
  </g>
  <rect x="440" y="210" width="20" height="10" fill="#1c1f2b"/>
  <rect x="420" y="220" width="60" height="8" fill="#12141e"/>

  <!-- keyboard -->
  <rect x="392" y="196" width="96" height="10" fill="#2a2e3f"/>

  <!-- coffee mug with steam -->
  <rect x="330" y="188" width="16" height="14" fill="#e2e2e2"/>
  <rect x="346" y="192" width="4" height="6" fill="#e2e2e2"/>
  <g stroke="#cfd8e3" stroke-width="2" fill="none" opacity="0.7">
    <path d="M336 184 q3 -6 0 -10">
      <animate attributeName="d" values="M336 184 q3 -6 0 -10;M336 184 q-3 -6 0 -10;M336 184 q3 -6 0 -10" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M342 184 q-3 -6 0 -10">
      <animate attributeName="d" values="M342 184 q-3 -6 0 -10;M342 184 q3 -6 0 -10;M342 184 q-3 -6 0 -10" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- plant -->
  <rect x="560" y="182" width="20" height="18" fill="#b5652b"/>
  <g fill="#3ecf6e">
    <g>
      <rect x="565" y="160" width="6" height="24"/>
      <rect x="571" y="150" width="6" height="20"/>
      <rect x="577" y="162" width="6" height="20"/>
      <animateTransform attributeName="transform" type="rotate" values="-2 570 200; 2 570 200; -2 570 200" dur="3.6s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- desk chair -->
  <g fill="#20263a">
    <rect x="296" y="150" width="30" height="8"/>
    <rect x="296" y="158" width="8" height="40"/>
  </g>
</svg>
