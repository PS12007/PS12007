<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" shape-rendering="crispEdges" role="img" aria-label="a pixel Pokemon Center at night">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070a18"/>
      <stop offset="60%" stop-color="#131c3a"/>
      <stop offset="100%" stop-color="#22305a"/>
    </linearGradient>
    <radialGradient id="doorglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffe9a8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="healglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ff9fc4" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ff9fc4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="250" fill="url(#night)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <rect x="60" y="18" width="4" height="4"><animate attributeName="opacity" values="1;0.15;1" dur="2.6s" repeatCount="indefinite"/></rect>
    <rect x="164" y="42" width="3" height="3"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" repeatCount="indefinite"/></rect>
    <rect x="252" y="16" width="4" height="4"><animate attributeName="opacity" values="1;0.2;1" dur="2.3s" begin="0.4s" repeatCount="indefinite"/></rect>
    <rect x="686" y="24" width="4" height="4"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.9s" repeatCount="indefinite"/></rect>
    <rect x="792" y="46" width="3" height="3"><animate attributeName="opacity" values="1;0.15;1" dur="3.3s" begin="0.7s" repeatCount="indefinite"/></rect>
    <rect x="856" y="20" width="4" height="4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.1s" repeatCount="indefinite"/></rect>
    <rect x="112" y="66" width="3" height="3"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.7s" repeatCount="indefinite"/></rect>
  </g>
  <circle cx="120" cy="40" r="18" fill="#ffe9a8" shape-rendering="geometricPrecision"/>
  <g fill="#131c3a" opacity="0.8" shape-rendering="geometricPrecision">
    <circle cx="113" cy="34" r="4.2"/><circle cx="127" cy="45" r="2.8"/><circle cx="120" cy="50" r="1.8"/>
  </g>

  <!-- hills + ground -->
  <g fill="#1a2748">
    <rect x="0" y="150" width="900" height="20"/>
    <rect x="60" y="140" width="110" height="12"/><rect x="720" y="140" width="120" height="12"/>
  </g>
  <rect x="0" y="164" width="900" height="86" fill="#1d3325"/>
  <rect x="0" y="164" width="900" height="5" fill="#2b4a33"/>

  <!-- path to the door -->
  <g fill="#3a4256">
    <rect x="414" y="164" width="72" height="8"/>
    <rect x="404" y="172" width="92" height="8"/>
    <rect x="394" y="180" width="112" height="6"/>
  </g>

  <!-- pokemon center -->
  <g>
    <!-- roof -->
    <polygon points="292,112 608,112 566,68 334,68" fill="#e0464b" shape-rendering="geometricPrecision"/>
    <polygon points="292,112 608,112 604,104 296,104" fill="#f2ead6" shape-rendering="geometricPrecision"/>
    <polygon points="334,68 566,68 562,74 338,74" fill="#f07076" shape-rendering="geometricPrecision"/>
    <!-- body -->
    <rect x="306" y="112" width="288" height="58" fill="#f2ead6"/>
    <rect x="306" y="164" width="288" height="6" fill="#cdc3a8"/>
    <!-- windows -->
    <g fill="#ffd98a">
      <rect x="326" y="124" width="30" height="22"><animate attributeName="opacity" values="1;0.72;1" dur="3.4s" repeatCount="indefinite"/></rect>
      <rect x="366" y="124" width="30" height="22"><animate attributeName="opacity" values="0.75;1;0.75" dur="2.8s" repeatCount="indefinite"/></rect>
      <rect x="504" y="124" width="30" height="22"><animate attributeName="opacity" values="1;0.7;1" dur="3.1s" repeatCount="indefinite"/></rect>
      <rect x="544" y="124" width="30" height="22"><animate attributeName="opacity" values="0.7;1;0.7" dur="3.7s" repeatCount="indefinite"/></rect>
    </g>
    <!-- sliding doors -->
    <circle cx="450" cy="150" r="60" fill="url(#doorglow)" shape-rendering="geometricPrecision"/>
    <rect x="418" y="122" width="64" height="48" fill="#8fd8f0"/>
    <rect x="418" y="122" width="64" height="48" fill="#cfefff" opacity="0.45">
      <animate attributeName="opacity" values="0.25;0.6;0.25" dur="2.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="448" y="122" width="4" height="48" fill="#dfe8ee"/>
    <!-- the P sign -->
    <circle cx="450" cy="88" r="19" fill="#f2ead6" stroke="#c23a3f" stroke-width="4" shape-rendering="geometricPrecision"/>
    <text x="450" y="96" text-anchor="middle" font-family="'Courier New',monospace" font-size="22" font-weight="bold" fill="#e0464b">P</text>
    <circle cx="450" cy="88" r="26" fill="none" stroke="#ff9aa0" stroke-width="2" opacity="0.6" shape-rendering="geometricPrecision">
      <animate attributeName="r" values="20;34;20" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0.7" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- healing pads with poke balls -->
  <g shape-rendering="geometricPrecision">
    <circle cx="228" cy="150" r="34" fill="url(#healglow)">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <rect x="206" y="160" width="44" height="8" rx="3" fill="#3d4a63" shape-rendering="crispEdges"/>
    <g transform="translate(228,146)">
      <animateTransform attributeName="transform" type="translate" values="228 146;228 140;228 146" dur="1.6s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="11" fill="#f6f6f6" stroke="#17171a" stroke-width="2.5"/>
      <path d="M-11 0 A11 11 0 0 1 11 0 Z" fill="#ee1515"/>
      <rect x="-11.5" y="-2" width="23" height="4" fill="#17171a"/>
      <circle cx="0" cy="0" r="3.6" fill="#f6f6f6" stroke="#17171a" stroke-width="2"/>
    </g>

    <circle cx="672" cy="150" r="34" fill="url(#healglow)">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <rect x="650" y="160" width="44" height="8" rx="3" fill="#3d4a63" shape-rendering="crispEdges"/>
    <g transform="translate(672,146)">
      <animateTransform attributeName="transform" type="translate" values="672 146;672 140;672 146" dur="1.6s" begin="0.35s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="11" fill="#f6f6f6" stroke="#17171a" stroke-width="2.5"/>
      <path d="M-11 0 A11 11 0 0 1 11 0 Z" fill="#ee1515"/>
      <rect x="-11.5" y="-2" width="23" height="4" fill="#17171a"/>
      <circle cx="0" cy="0" r="3.6" fill="#f6f6f6" stroke="#17171a" stroke-width="2"/>
    </g>
  </g>

  <!-- floating heal hearts -->
  <g fill="#ff9fc4">
    <g><rect x="252" y="120" width="4" height="4"/><rect x="248" y="124" width="12" height="4"/><rect x="250" y="128" width="8" height="4"/><rect x="252" y="132" width="4" height="4"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -34" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0" dur="2.8s" repeatCount="indefinite"/></g>
    <g><rect x="646" y="124" width="4" height="4"/><rect x="642" y="128" width="12" height="4"/><rect x="644" y="132" width="8" height="4"/><rect x="646" y="136" width="4" height="4"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -30" dur="3.2s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0" dur="3.2s" begin="0.6s" repeatCount="indefinite"/></g>
  </g>

  <!-- grass tufts -->
  <g fill="#20512f">
    <g><rect x="60" y="154" width="6" height="12"/><rect x="70" y="148" width="6" height="18"/><rect x="80" y="156" width="6" height="10"/>
      <animateTransform attributeName="transform" type="skewX" values="0;5;0;-5;0" dur="3.6s" repeatCount="indefinite"/></g>
    <g><rect x="806" y="154" width="6" height="12"/><rect x="816" y="147" width="6" height="19"/><rect x="826" y="155" width="6" height="11"/>
      <animateTransform attributeName="transform" type="skewX" values="0;-6;0;6;0" dur="4.1s" repeatCount="indefinite"/></g>
  </g>

  <!-- dialogue box -->
  <g shape-rendering="geometricPrecision">
    <rect x="20" y="190" width="860" height="48" rx="8" fill="#f7f7f2" stroke="#26262a" stroke-width="4"/>
    <rect x="28" y="198" width="844" height="32" rx="5" fill="none" stroke="#d3d3c8" stroke-width="2"/>
    <g font-family="'Courier New',monospace" font-size="17" font-weight="bold" fill="#26262a">
      <text x="46" y="220">Your code is fully healed! We hope to see you again!<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.46;0.5;1" dur="9s" repeatCount="indefinite"/></text>
      <text x="46" y="220">SAVING... do not turn off the power.<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.48;0.52;1" dur="9s" repeatCount="indefinite"/></text>
    </g>
    <polygon points="848,220 862,220 855,229" fill="#26262a">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.2s" repeatCount="indefinite"/>
    </polygon>
  </g>
</svg>
