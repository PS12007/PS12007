<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="Pokemon style base stats sheet">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b2740"/>
      <stop offset="100%" stop-color="#111a2b"/>
    </linearGradient>
  </defs>

  <rect width="900" height="320" fill="#0d1117"/>
  <rect x="30" y="14" width="840" height="290" rx="14" fill="url(#panel)" stroke="#f0c000" stroke-width="3"/>

  <!-- corner rivets -->
  <g fill="#f0c000" opacity="0.8">
    <circle cx="48" cy="32" r="3"/><circle cx="852" cy="32" r="3"/>
    <circle cx="48" cy="286" r="3"/><circle cx="852" cy="286" r="3"/>
  </g>

  <text x="52" y="52" font-family="'Courier New',monospace" font-size="19" font-weight="bold" fill="#f0c000" letter-spacing="3">BASE STATS</text>
  <text x="848" y="52" text-anchor="end" font-family="'Courier New',monospace" font-size="15" font-weight="bold" fill="#8fa3c0">TOTAL 832</text>
  <line x1="52" y1="62" x2="848" y2="62" stroke="#2c3b57" stroke-width="2"/>

  <g font-family="'Courier New',monospace" font-weight="bold">
    <!-- HP -->
    <text x="52" y="88" font-size="14" fill="#e6edf7">HP</text>
    <text x="120" y="88" font-size="10" fill="#7d90ad">caffeine reserves</text>
    <rect x="250" y="76" width="540" height="16" rx="8" fill="#20304a"/>
    <rect x="250" y="76" height="16" rx="8" fill="#ff5959" width="0">
      <animate attributeName="width" from="0" to="400" dur="1.1s" begin="0s" fill="freeze"/>
    </rect>
    <text x="848" y="89" text-anchor="end" font-size="14" fill="#e6edf7">148</text>

    <!-- ATTACK -->
    <text x="52" y="122" font-size="14" fill="#e6edf7">ATTACK</text>
    <text x="120" y="122" font-size="10" fill="#7d90ad">ships on Fridays</text>
    <rect x="250" y="110" width="540" height="16" rx="8" fill="#20304a"/>
    <rect x="250" y="110" height="16" rx="8" fill="#f5ac78" width="0">
      <animate attributeName="width" from="0" to="356" dur="1.1s" begin="0.12s" fill="freeze"/>
    </rect>
    <text x="848" y="123" text-anchor="end" font-size="14" fill="#e6edf7">132</text>

    <!-- DEFENSE -->
    <text x="52" y="156" font-size="14" fill="#e6edf7">DEFENSE</text>
    <text x="120" y="156" font-size="10" fill="#7d90ad">code review armour</text>
    <rect x="250" y="144" width="540" height="16" rx="8" fill="#20304a"/>
    <rect x="250" y="144" height="16" rx="8" fill="#fae078" width="0">
      <animate attributeName="width" from="0" to="259" dur="1.1s" begin="0.24s" fill="freeze"/>
    </rect>
    <text x="848" y="157" text-anchor="end" font-size="14" fill="#e6edf7">96</text>

    <!-- SP. ATK -->
    <text x="52" y="190" font-size="14" fill="#e6edf7">SP. ATK</text>
    <text x="120" y="190" font-size="10" fill="#7d90ad">CUDA kernels</text>
    <rect x="250" y="178" width="540" height="16" rx="8" fill="#20304a"/>
    <rect x="250" y="178" height="16" rx="8" fill="#9db7f5" width="0">
      <animate attributeName="width" from="0" to="459" dur="1.1s" begin="0.36s" fill="freeze"/>
    </rect>
    <text x="848" y="191" text-anchor="end" font-size="14" fill="#e6edf7">170</text>

    <!-- SP. DEF -->
    <text x="52" y="224" font-size="14" fill="#e6edf7">SP. DEF</text>
    <text x="120" y="224" font-size="10" fill="#7d90ad">2am stack traces</text>
    <rect x="250" y="212" width="540" height="16" rx="8" fill="#20304a"/>
    <rect x="250" y="212" height="16" rx="8" fill="#a7db8d" width="0">
      <animate attributeName="width" from="0" to="327" dur="1.1s" begin="0.48s" fill="freeze"/>
    </rect>
    <text x="848" y="225" text-anchor="end" font-size="14" fill="#e6edf7">121</text>

    <!-- SPEED -->
    <text x="52" y="258" font-size="14" fill="#e6edf7">SPEED</text>
    <text x="120" y="258" font-size="10" fill="#7d90ad">tokens per second</text>
    <rect x="250" y="246" width="540" height="16" rx="8" fill="#20304a"/>
    <rect x="250" y="246" height="16" rx="8" fill="#fa92b2" width="0">
      <animate attributeName="width" from="0" to="446" dur="1.1s" begin="0.6s" fill="freeze"/>
    </rect>
    <text x="848" y="259" text-anchor="end" font-size="14" fill="#e6edf7">165</text>
  </g>

  <line x1="52" y1="272" x2="848" y2="272" stroke="#2c3b57" stroke-width="2"/>
  <g font-family="'Courier New',monospace" font-size="11" fill="#7d90ad">
    <text x="52" y="292">NATURE: Curious (+Sp. Atk, -sleep)</text>
    <text x="848" y="292" text-anchor="end">ABILITY: Overclock &#183; HIDDEN: Rubber Duck</text>
  </g>
</svg>
